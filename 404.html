<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Page not found | Mindveda</title><style>:root{--a:#facc15;--bg:#fff;--tx:#111827;--mut:#6b7280;--bd:#e5e7eb}@media(prefers-color-scheme:dark){:root{--bg:#0b0f17;--tx:#f3f4f6;--mut:#9ca3af;--bd:#243041}}*{box-sizing:border-box}body{margin:0;font:16px/1.6 system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--tx);display:grid;min-height:100vh;place-items:center;padding:24px}main{max-width:560px;width:100%;text-align:center}h1{font-size:64px;margin:0;color:var(--a)}p{color:var(--mut)}a.b{display:inline-block;background:var(--a);color:#0b1220;padding:12px 22px;border-radius:12px;font-weight:700;text-decoration:none}a.b:focus-visible,li a:focus-visible{outline:3px solid var(--tx);outline-offset:2px}ul{list-style:none;padding:0;margin:28px 0 0;display:grid;gap:8px}li a{display:block;padding:12px;border:1px solid var(--bd);border-radius:12px;color:var(--tx);text-decoration:none}</style></head><body><main><h1>404</h1><h2>Page not found</h2><p>The page you are looking for does not exist or has moved.</p><a class="b" href="/">Back to home</a><ul id="s"></ul></main><script>fetch("/products.json").then(function(r){return r.json()}).then(function(d){var u=document.getElementById("s");(d.products||[]).slice(0,3).forEach(function(p){if(!p||!p.id)return;var l=document.createElement("li"),a=document.createElement("a");a.href="/p/"+encodeURIComponent(p.id)+".html";a.textContent=p.name||p.id;l.appendChild(a);u.appendChild(l)})}).catch(function(){})</script></body></html>
